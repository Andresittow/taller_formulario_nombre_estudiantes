<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            max-width: 420px;
        }

        .icono {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background: #1d4ed8;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        a:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icono">✅</div>
        <h1>Asistencia registrada</h1>
        <p>La información fue guardada correctamente en el sistema.</p>
        <a href="{% url 'registrar_asistencia' %}">Registrar otra asistencia</a>
    </div>

</body>
</html>
